<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{fsdocs-page-title}} — Warp 11</title>
{{fsdocs-meta-tags}}
<link rel="stylesheet" href="/style.css">
{{fsdocs-head-extra}}
</head>
<body class="{{fsdocs-body-class}}">
<header>
  <a class="brand" href="/">warp<span>11</span></a>
  <!-- The same standing badge `build.fsx` puts on every authored page. It
       belongs here more than there, not less: a reader who lands on a reference
       page from a search engine is by definition looking up an API they are
       about to build against, and this is the one place that says the API moves.
       Absolute href because fsdocs is run with `--parameters root /`, so every
       link it generates is absolute already. -->
  <a class="prerelease" href="/#what-is-not-built"
     title="The API is not stable — the packages on NuGet are prereleases">pre-release</a>
  <nav class="top">
    <a href="/guides/start-a-project">Guides</a>
    <a href="/tutorial/counter">Tutorial</a>
    <a href="/examples/mandelbrot">Examples</a>
    <a href="/reference/">Reference</a>
    <a href="https://github.com/warp-11/warp-11-core">GitHub</a>
  </nav>
</header>
<div class="shell">
  <aside>
    <div class="group">
      <h3>Reference</h3>
      {{fsdocs-list-of-namespaces}}
    </div>
  </aside>
  <main class="api">
{{fsdocs-content}}
  </main>
</div>
<footer>warp11 — an F# HDL that runs on real FPGAs. Pre-release.</footer>
{{fsdocs-tooltips}}
<!-- fsdocs puts each member's parameter and return TYPES in a hover tooltip and
     nowhere else, so without this script the reference shows names and no types
     at all. Self-hosted from the `content/` tree fsdocs generates beside the
     pages; none of its other scripts are loaded, because this site has no theme
     toggle and its own search. -->
<script type="module" src="/content/fsdocs-tips.js"></script>
{{fsdocs-body-extra}}
</body>
</html>
